name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Runners are UTC; the suite computes dates in Node and renders the calendar in the browser
# at this timezone (`use.timezoneId`). Both must agree or the past-date test flips near midnight.
env:
  TZ: America/New_York

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  # The gate — deterministic desktop lane, stubbed autocomplete. Must be green.
  e2e-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-chromium
          path: playwright-report/
          retention-days: 14

  # Signals, not gates: the Pixel 7 viewport (deterministic but interaction-fragile) and
  # the real site (bot-protected + latency-prone; the POM fixture skips when Akamai blocks
  # the runner).
  e2e-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint-and-typecheck
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        lane: [test:mobile, test:live]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run ${{ matrix.lane }}
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.lane == 'test:mobile' && 'mobile' || 'live' }}
          path: playwright-report/
          retention-days: 14
